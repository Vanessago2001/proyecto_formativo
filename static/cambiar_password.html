<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertiSENA - Cambiar contraseña</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/tema.css?v=20261028">
    <link rel="stylesheet" href="/static/styles.css?v=20261028">
    <style>
        /* Formulario angosto: arranca a 28px del encabezado y usa los campos y
           botones del sistema (tema.css). styles.css da a .form-group input
           padding 14px, radio 10px, texto centrado y letter-spacing 4px. */
        .login-container { padding: 28px 20px; }
        .login-form .form-group input,
        .login-form .form-group select {
            min-height: var(--campo-alto);
            padding: 8px 10px;
            border: 1px solid var(--campo-borde);
            border-radius: var(--campo-radio);
            background-color: #fff;
            font-family: var(--tipografia);
            font-size: var(--txt-base);
            text-align: left;
            letter-spacing: 0;
        }
        .login-form .form-group input:focus,
        .login-form .form-group select:focus { border-color: var(--verde-600); }
        .login-form .form-group input[readonly] { background-color: var(--gris-100); color: var(--gris-700); }
        .login-form .btn-bloque { margin-top: 10px; }
        .btn.hidden-section { display: none; }
    </style>
</head>
<body>

<header class="login-header">

    <div class="header-content">

        <div class="header-left">

            <img
                src="/static/sena_blanco.png"
                alt="Logo SENA"
                class="sena-blanco"
            >

            <div class="header-text">

                <h1>CertiSENA</h1>

                <p class="subtitle">
                    Plataforma de gestión y consulta de certificados
                </p>

                <p class="small-text">
                    Servicio Nacional de Aprendizaje • CertiSENA
                </p>

            </div>

        </div>

    </div>

</header>

<main class="login-container">

    <section class="login-form">

        <h2>Contraseña expirada</h2>

        <p style="text-align:center;margin-bottom:25px;color:#666;">
            Su contraseña ha expirado. Debe cambiarla para continuar.
        </p>

        <div class="form-group">

            <label>Correo</label>

            <input
                type="email"
                id="correo"
                readonly
            >

        </div>

        <div class="form-group">

            <label>Contraseña actual</label>

            <input
                type="password"
                id="actual"
            >

        </div>

        <div class="form-group">

            <label>Nueva contraseña</label>

            <input
                type="password"
                id="nueva"
            >

        </div>

        <div class="form-group">

            <label>Confirmar contraseña</label>

            <input
                type="password"
                id="confirmar"
            >

        </div>

        <button
            class="btn btn-primario btn-bloque primary-action"
            onclick="cambiarPassword()"
        >
            Cambiar contraseña
        </button>

        <div
            id="mensaje"
            class="error-message"
            style="margin-top:20px;text-align:center;"
        ></div>

    </section>

</main>

<footer class="login-footer">

    <p>
        © 2026 CertiSENA - SENA. Todos los derechos reservados.
    </p>

</footer>

<script>

const correoGuardado = localStorage.getItem("correo_expirado");

if(correoGuardado){
    document.getElementById("correo").value = correoGuardado;
}

async function cambiarPassword(){

    const correo = document.getElementById("correo").value;
    const actual = document.getElementById("actual").value;
    const nueva = document.getElementById("nueva").value;
    const confirmar = document.getElementById("confirmar").value;
    const mensaje = document.getElementById("mensaje");

    mensaje.innerHTML = "";

    if(nueva !== confirmar){

        mensaje.innerHTML = "Las contraseñas no coinciden.";

        return;

    }

    const response = await fetch("/auth/cambiar-password-expirada",{

        method:"PUT",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            correo:correo,
            password_actual:actual,
            password_nueva:nueva

        })

    });

    const data = await response.json().catch(() => ({}));

    if(response.ok){

        alert("Contraseña actualizada correctamente.");

        localStorage.removeItem("correo_expirado");

        window.location.href="/static/login.html";

    }else{

        // textContent: el detalle viene del servidor (y en un 422 es una lista).
        mensaje.textContent=mensajeErrorApi(data,"No se pudo cambiar la contraseña.");

    }

}

</script>

<script src="/static/errores-api.js?v=20261104"></script>
<script src="/static/session.js?v=20261029"></script>
</body>
</html>
