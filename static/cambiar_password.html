<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertiSENA - Cambiar contraseña</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<header class="login-header">

    <div class="header-content">

        <div class="header-left">

            <img
                src="/static/sena_blanco.png"
                alt="Logo SENA"
                class="sena-blanco"
            >

            <div class="header-text">

                <h1>CertiSENA</h1>

                <p class="subtitle">
                    Plataforma de gestión y consulta de certificados
                </p>

                <p class="small-text">
                    Servicio Nacional de Aprendizaje • CertiSENA
                </p>

            </div>

        </div>

    </div>

</header>

<main class="login-container">

    <section class="login-form">

        <h2>Contraseña expirada</h2>

        <p style="text-align:center;margin-bottom:25px;color:#666;">
            Su contraseña ha expirado. Debe cambiarla para continuar.
        </p>

        <div class="form-group">

            <label>Correo</label>

            <input
                type="email"
                id="correo"
                readonly
            >

        </div>

        <div class="form-group">

            <label>Contraseña actual</label>

            <input
                type="password"
                id="actual"
            >

        </div>

        <div class="form-group">

            <label>Nueva contraseña</label>

            <input
                type="password"
                id="nueva"
            >

        </div>

        <div class="form-group">

            <label>Confirmar contraseña</label>

            <input
                type="password"
                id="confirmar"
            >

        </div>

        <button
            class="primary-action"
            onclick="cambiarPassword()"
            style="width:100%;margin-top:15px;"
        >
            Cambiar contraseña
        </button>

        <div
            id="mensaje"
            class="error-message"
            style="margin-top:20px;text-align:center;"
        ></div>

    </section>

</main>

<footer class="login-footer">

    <p>
        © 2026 CertiSENA - SENA. Todos los derechos reservados.
    </p>

</footer>

<script>

const correoGuardado = localStorage.getItem("correo_expirado");

if(correoGuardado){
    document.getElementById("correo").value = correoGuardado;
}

async function cambiarPassword(){

    const correo = document.getElementById("correo").value;
    const actual = document.getElementById("actual").value;
    const nueva = document.getElementById("nueva").value;
    const confirmar = document.getElementById("confirmar").value;
    const mensaje = document.getElementById("mensaje");

    mensaje.innerHTML = "";

    if(nueva !== confirmar){

        mensaje.innerHTML = "Las contraseñas no coinciden.";

        return;

    }

    const response = await fetch("/auth/cambiar-password-expirada",{

        method:"PUT",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            correo:correo,
            password_actual:actual,
            password_nueva:nueva

        })

    });

    const data = await response.json();

    if(response.ok){

        alert("Contraseña actualizada correctamente.");

        localStorage.removeItem("correo_expirado");

        window.location.href="/";

    }else{

        mensaje.innerHTML=data.detail;

    }

}

</script>

</body>
</html>
