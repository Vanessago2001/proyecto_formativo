<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verificar código</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/static/styles.css">
</head>

<body>

<header class="login-header">
<div class="header-content">
<div class="header-left">

<img src="/static/sena_blanco.png" class="sena-blanco">

<div>
<h1>CertiSENA</h1>
<p class="subtitle">Plataforma de gestión y consulta de certificados</p>
</div>

</div>
</div>
</header>

<main class="login-container">

<section class="login-form">

<h2>Verificar código</h2>

<p>Ingresa el código recibido en tu correo.</p>

<div class="form-group">
<label>Código</label>

<input
type="text"
id="codigo"
maxlength="6"
placeholder="Código de 6 dígitos">

</div>

<button
id="btnVerificar"
class="btn-login">

Verificar código

</button>

<div id="message" class="error-message"></div>

</section>

</main>

<footer class="login-footer">
<p>© 2026 CertiSENA - SENA</p>
</footer>

<script>

const correo = sessionStorage.getItem("password_reset_correo");

const btn = document.getElementById("btnVerificar");
const codigo = document.getElementById("codigo");
const message = document.getElementById("message");

if(!correo){
    message.textContent="No se encontró el correo.";
    btn.disabled=true;
}

btn.addEventListener("click", async ()=>{

    message.textContent="";

    if(codigo.value.trim().length!==6){
        message.textContent="Ingrese un código válido.";
        return;
    }

    btn.disabled=true;
    message.textContent="Verificando código...";

    try{

        const response = await fetch("/password-reset/verify",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                correo:correo,
                codigo:codigo.value.trim()

            })

        });

        const data = await response.json();

        console.log(data);

        if(!response.ok){

            message.textContent=data.detail || "Código inválido.";
            btn.disabled=false;
            return;

        }

        message.innerHTML=`
            Código verificado correctamente.<br><br>
            Se ha enviado un enlace de recuperación a tu correo.<br>
            Revísalo y haz clic en el enlace para cambiar tu contraseña.
        `;

        btn.style.display="none";

    }catch(error){

        console.error(error);

        message.textContent="Error de conexión.";
        btn.disabled=false;

    }

});

</script>

</body>
</html>
