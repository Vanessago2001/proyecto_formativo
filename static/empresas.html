<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CertiSENA | Empresas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>

<body class="comite-page">
  <header class="login-header">
    <div class="header-content">
      <div class="header-left">
        <img src="/static/sena_blanco.png" alt="Logo SENA" class="sena-blanco">
        <div>
          <h1>CertiSENA</h1>
          <p class="subtitle">Gestión de empresas</p>
        </div>
      </div>
      <div class="comite-header-user">
        <a class="comite-back-button" href="/dashboard">Panel</a>
        <a class="profile-link" href="/profile">Mi perfil</a>
        <button id="logoutButton" class="comite-logout" type="button">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main class="comite-shell">
    <div class="comite-layout">
      <aside class="comite-sidebar" aria-label="Navegación del módulo de empresas">
        <div class="comite-sidebar-heading">
          <span class="comite-kicker">Módulo de empresas</span>
          <strong>Empresas y sedes</strong>
        </div>
        <nav id="menu"></nav>
        <div class="comite-access-note">
          <span id="roleLabel">Validando permisos...</span>
          <small>Las acciones visibles dependen del rol autenticado.</small>
        </div>
      </aside>

      <section class="comite-content">
        <div class="comite-page-heading">
          <div>
            <span class="comite-kicker">Empresas</span>
            <h2 id="viewTitle">Empresas</h2>
            <p id="viewDescription"></p>
          </div>
          <button id="refreshButton" class="comite-button secondary" type="button">Actualizar</button>
        </div>

        <div id="feedback" class="comite-feedback" role="status" aria-live="polite"></div>

        <section id="vista-listado" class="comite-view-hidden"></section>
        <section id="vista-detalle" class="comite-view-hidden"></section>
        <section id="vista-aprobaciones" class="comite-view-hidden"></section>

        <section id="vista-registrar" class="comite-view-hidden">
          <div class="comite-panel">
            <div class="comite-panel-heading">
              <div>
                <h3>Datos de la empresa</h3>
                <p>Después de registrarla podrá agregar sus sedes y sus contactos.</p>
              </div>
            </div>
            <form id="formRegistrar" class="portal-form-grid">
              <div class="full">
                <label for="regNombre">Nombre o razón social</label>
                <input id="regNombre" type="text" maxlength="70" required>
              </div>
              <div>
                <label for="regNit">NIT</label>
                <input id="regNit" type="text" maxlength="40" required>
              </div>
              <div>
                <label for="regCorreo">Correo</label>
                <input id="regCorreo" type="email" maxlength="100" required>
              </div>
              <div>
                <label for="regCiudad">Ciudad</label>
                <input id="regCiudad" type="text" maxlength="30" required>
              </div>
              <div>
                <label for="regDireccion">Dirección</label>
                <input id="regDireccion" type="text" maxlength="140" required>
              </div>
              <div class="full comite-decision-actions">
                <button class="comite-button primary" type="submit">Registrar empresa</button>
                <button class="comite-button secondary" type="reset">Limpiar</button>
              </div>
            </form>
          </div>
        </section>
      </section>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      // ---------------- sesión y permisos ----------------
      const token = localStorage.getItem("access_token");
      if (!token) {
        window.location.href = "/login";
        return;
      }

      const payload = leerToken(token);
      if (!payload) return;

      const ALIAS = {
        superadministrador: "superadmin", superadmin: "superadmin", superadm: "superadmin",
        administrador: "admin", admin: "admin", adm: "admin", aprobador: "admin",
        auxiliar: "auxiliar", aux: "auxiliar",
        empresa: "empresa", empresario: "empresa",
        auditor: "auditor", aud: "auditor",
        comite: "comite", com: "comite"
      };
      const clave = String(payload.role_name || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[\s_-]+/g, "");
      const rol = ALIAS[clave] || clave;

      // Roles por acción según la hoja "M3 — EMPRESAS".
      const PERMISOS = {
        consultar: ["superadmin", "admin", "auxiliar", "empresa", "auditor", "comite"],
        listar: ["superadmin", "admin", "auxiliar", "auditor", "comite"],
        gestionar: ["superadmin", "admin", "auxiliar", "empresa"],
        eliminar: ["superadmin", "admin", "empresa"],
        estado: ["superadmin", "admin"],
        reactivar: ["superadmin"],
        // REQ: el Auxiliar pide estas acciones y un superior las aprueba.
        solicitar: ["auxiliar"],
        aprobar: ["superadmin", "admin"],
        verAprobaciones: ["superadmin", "admin", "auxiliar"]
      };
      const puede = (accion) => PERMISOS[accion].includes(rol);

      if (!puede("consultar")) {
        window.location.href = "/dashboard";
        return;
      }

      const esEmpresa = rol === "empresa";
      const VISTAS = {
        listado: ["Empresas registradas", "Consulte las empresas, su estado y su información."],
        detalle: [esEmpresa ? "Mi empresa" : "Detalle de la empresa", "Datos, estado, sedes, contactos, documentos e historial de la empresa."],
        registrar: ["Registrar empresa", "Registre una empresa nueva."],
        aprobaciones: [
          rol === "auxiliar" ? "Mis solicitudes de aprobación" : "Aprobaciones",
          "Acciones que requieren la aprobación de un superior antes de ejecutarse."
        ]
      };

      const estado = {
        vista: null,
        empresas: [],
        mias: [],
        actual: null,
        texto: "",
        filtroEstado: "",
        editandoEmpresa: false,
        sedeEditada: null,
        sedeContactos: null,
        contactoEditado: null,
        aprobaciones: [],
        filtroAprobacion: "Pendiente",
        rechazando: null
      };

      const $ = (selector) => document.querySelector(selector);
      $("#roleLabel").textContent = "Rol: " + (payload.role_name || "Usuario");

      function leerToken(valor) {
        try {
          const parte = valor.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
          return JSON.parse(decodeURIComponent(atob(parte).split("").map((c) => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join("")));
        } catch (_) {
          localStorage.clear();
          window.location.href = "/login";
          return null;
        }
      }

      // ---------------- utilidades ----------------
      async function api(ruta, opciones) {
        const peticion = Object.assign({}, opciones || {}, {
          headers: Object.assign({ Authorization: "Bearer " + token }, (opciones && opciones.headers) || {})
        });
        const respuesta = await fetch(ruta, peticion);
        if (respuesta.status === 401) {
          localStorage.clear();
          window.location.href = "/login";
          return null;
        }
        const tipo = respuesta.headers.get("content-type") || "";
        const cuerpo = tipo.includes("json") ? await respuesta.json().catch(() => null) : null;
        if (!respuesta.ok) {
          const detalle = cuerpo && cuerpo.detail;
          if (typeof detalle === "string") throw new Error(detalle);
          if (Array.isArray(detalle)) throw new Error(detalle.map((d) => (d.msg || "").replace(/^Value error, /, "")).join(" · "));
          throw new Error("No fue posible completar la solicitud (" + respuesta.status + ").");
        }
        return cuerpo;
      }

      function enviar(ruta, metodo, cuerpo) {
        return api(ruta, {
          method: metodo,
          headers: { "Content-Type": "application/json" },
          body: cuerpo === undefined ? undefined : JSON.stringify(cuerpo)
        });
      }

      function mostrar(mensaje, tipo) {
        const caja = $("#feedback");
        caja.textContent = mensaje || "";
        caja.className = "comite-feedback" + (mensaje ? " " + tipo : "");
      }

      const esc = (valor) => String(valor == null ? "" : valor)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      const fecha = (valor) => valor ? new Date(valor).toLocaleDateString("es-CO") : "-";
      const val = (id) => { const campo = document.getElementById(id); return campo ? campo.value.trim() : ""; };
      const panel = (contenido) => '<div class="comite-panel">' + contenido + "</div>";
      const cargando = (texto) => panel('<div class="comite-loading">' + esc(texto) + "</div>");
      const fact = (etiqueta, valor) => "<div><dt>" + esc(etiqueta) + "</dt><dd>" + esc(valor) + "</dd></div>";
      const vacioTabla = (columnas, texto) => '<tr><td colspan="' + columnas + '"><div class="comite-table-empty">' + esc(texto) + "</div></td></tr>";
      const accion = (nombre, texto, id) => '<button class="comite-table-action" type="button" data-accion="' + nombre + '" data-id="' + esc(id) + '">' + texto + "</button>";
      const boton = (nombre, texto, tipo) => '<button class="comite-button ' + tipo + '" type="button" data-accion="' + nombre + '">' + texto + "</button>";
      const encabezado = (titulo, descripcion, extra) => '<div class="comite-panel-heading"><div><h3>' + titulo + "</h3><p>" + descripcion + "</p></div>" + (extra || "") + "</div>";

      function claseEstado(valor) {
        const texto = String(valor || "").toLowerCase();
        if (/(inactiv|cancel|rechaz|vencid)/.test(texto)) return "rejected";
        if (/(^activ|aprobad|radicad|validad)/.test(texto)) return "approved";
        return "pending";
      }
      const chip = (valor) => '<span class="comite-status ' + claseEstado(valor) + '">' + esc(valor || "-") + "</span>";

      function campo(id, etiqueta, valor, clase, tipo) {
        return '<div class="' + (clase || "") + '"><label for="' + id + '">' + etiqueta + "</label>" +
          '<input id="' + id + '" type="' + (tipo || "text") + '" value="' + esc(valor == null ? "" : valor) + '"></div>';
      }

      function selector(id, etiqueta, opciones, valor, clase) {
        return '<div class="' + (clase || "") + '"><label for="' + id + '">' + etiqueta + '</label><select id="' + id + '">' +
          opciones.map(([v, t]) => '<option value="' + esc(v) + '"' + (v === valor ? " selected" : "") + ">" + esc(t) + "</option>").join("") +
          "</select></div>";
      }

      function limpiarEdicion() {
        estado.editandoEmpresa = false;
        estado.sedeEditada = null;
        estado.sedeContactos = null;
        estado.contactoEditado = null;
      }

      // ---------------- menú y vistas ----------------
      const opcionesMenu = [];
      if (puede("listar")) opcionesMenu.push(["listado", "Empresas registradas"]);
      opcionesMenu.push(["detalle", VISTAS.detalle[0]]);
      if (puede("gestionar")) opcionesMenu.push(["registrar", "Registrar empresa"]);
      if (puede("verAprobaciones")) opcionesMenu.push(["aprobaciones", VISTAS.aprobaciones[0]]);
      $("#menu").innerHTML = opcionesMenu.map(([vista, texto]) =>
        '<button class="comite-nav-link" type="button" data-view="' + vista + '">' + texto + "</button>").join("") +
        (esEmpresa ? '<a class="comite-nav-link" style="text-decoration:none" href="/empresa">Solicitudes de certificación</a>' : "");

      function mostrarVista(nombre) {
        estado.vista = nombre;
        document.querySelectorAll(".comite-nav-link[data-view]").forEach((b) => b.classList.toggle("active", b.dataset.view === nombre));
        Object.keys(VISTAS).forEach((vista) => $("#vista-" + vista).classList.toggle("comite-view-hidden", vista !== nombre));
        $("#viewTitle").textContent = VISTAS[nombre][0];
        $("#viewDescription").textContent = VISTAS[nombre][1];
        mostrar("");
        if (nombre === "listado") return cargarListado();
        if (nombre === "detalle") return cargarDetalle();
        if (nombre === "aprobaciones") return cargarAprobaciones();
      }

      // ---------------- listado (EMP-004 / EMP-005) ----------------
      async function cargarListado() {
        const caja = $("#vista-listado");
        caja.innerHTML = cargando("Cargando empresas...");
        try {
          estado.empresas = (await api("/api/empresas/")) || [];
          renderizarListado();
        } catch (error) {
          caja.innerHTML = "";
          mostrar(error.message, "error");
        }
      }

      function renderizarListado() {
        const texto = estado.texto.toLowerCase();
        const visibles = estado.empresas.filter((e) =>
          (!estado.filtroEstado || (e.estado || "Activa") === estado.filtroEstado) &&
          (!texto || [e.nombre, e.nit, e.ciudad, e.correo].some((v) => String(v || "").toLowerCase().includes(texto))));

        $("#vista-listado").innerHTML =
          '<div class="comite-toolbar">' +
          '<form id="formBuscar" class="comite-search-form"><label for="buscarTexto">Buscar empresa</label><div class="comite-search-row">' +
          '<input id="buscarTexto" type="search" placeholder="Nombre, NIT, ciudad o correo" value="' + esc(estado.texto) + '">' +
          '<button class="comite-button primary" type="submit">Buscar</button></div></form>' +
          '<div class="comite-search-form" style="flex:0 1 220px">' +
          selector("filtroEstado", "Estado", [["", "Todos"], ["Activa", "Activa"], ["Suspendida", "Suspendida"], ["Inactiva", "Inactiva"]], estado.filtroEstado) +
          "</div></div>" +
          panel(
            encabezado("Empresas", visibles.length + (visibles.length === 1 ? " empresa" : " empresas"),
              puede("gestionar") ? '<button class="comite-button primary" type="button" data-ir="registrar">Registrar empresa</button>' : "") +
            '<div class="comite-table-wrap"><table><thead><tr><th>Empresa</th><th>NIT</th><th>Ciudad</th><th>Correo</th><th>Estado</th><th>Acción</th></tr></thead><tbody>' +
            (visibles.map((e) => "<tr><td><strong>" + esc(e.nombre) + "</strong></td><td>" + esc(e.nit) + "</td><td>" + esc(e.ciudad) + "</td>" +
              "<td>" + esc(e.correo) + "</td><td>" + chip(e.estado || "Activa") + "</td><td>" + accion("ver", "Ver detalle", e.id_empresa) + "</td></tr>").join("") ||
              vacioTabla(6, "No hay empresas para mostrar con los filtros actuales.")) +
            "</tbody></table></div>"
          );

        $("#formBuscar").addEventListener("submit", (evento) => {
          evento.preventDefault();
          estado.texto = val("buscarTexto");
          renderizarListado();
        });
        $("#filtroEstado").addEventListener("change", (evento) => {
          estado.filtroEstado = evento.target.value;
          renderizarListado();
        });
      }

      // ---------------- detalle ----------------
      async function cargarDetalle() {
        const caja = $("#vista-detalle");
        if (!estado.actual) {
          caja.innerHTML = panel(
            '<div class="comite-empty-state"><span class="comite-empty-icon">+</span>' +
            "<h3>" + (esEmpresa ? "Su cuenta todavía no tiene una empresa asociada" : "Seleccione una empresa") + "</h3>" +
            "<p>" + (esEmpresa ? "Regístrela para poder agregar sus sedes y contactos." : "Elíjala en el listado de empresas.") + "</p>" +
            '<div class="comite-decision-actions" style="justify-content:center">' +
            (esEmpresa ? '<button class="comite-button primary" type="button" data-ir="registrar">Registrar empresa</button>' : "") +
            (puede("listar") ? '<button class="comite-button primary" type="button" data-ir="listado">Ir al listado</button>' : "") +
            "</div></div>"
          );
          return;
        }

        caja.innerHTML = cargando("Cargando empresa...");
        const base = "/api/empresas/" + estado.actual;
        try {
          const [empresa, sedes, documentos, historial] = await Promise.all([
            api(base),
            api(base + "/sedes"),
            api(base + "/documentos").catch((e) => ({ error: e.message })),
            api(base + "/solicitudes").catch((e) => ({ error: e.message }))
          ]);
          const sedeContactos = sedes.find((s) => String(s.id_sede) === estado.sedeContactos) || null;
          const contactos = sedeContactos
            ? await api(base + "/sedes/" + estado.sedeContactos + "/contactos").catch((e) => ({ error: e.message }))
            : null;

          caja.innerHTML = '<div class="portal-stack">' +
            selectorMisEmpresas() +
            panelEmpresa(empresa) +
            panelSedes(sedes) +
            (sedeContactos ? panelContactos(sedeContactos, contactos) : "") +
            panelDocumentos(documentos) +
            panelHistorial(historial) +
            "</div>";
        } catch (error) {
          caja.innerHTML = "";
          mostrar(error.message, "error");
        }
      }

      function selectorMisEmpresas() {
        if (!esEmpresa || estado.mias.length < 2) return "";
        return '<div class="comite-toolbar"><div class="comite-search-form">' +
          selector("selectorEmpresa", "Empresa", estado.mias.map((e) => [String(e.id_empresa), e.nombre + " · NIT " + e.nit]), estado.actual) +
          "</div></div>";
      }

      // EMP-002 editar, EMP-006/007/008 estado
      function panelEmpresa(e) {
        const actual = e.estado || "Activa";
        const acciones = [];
        const conAprobacion = puede("solicitar");
        // Con REQ el botón no ejecuta: envía la solicitud a aprobación.
        const texto = (verbo, sustantivo) => conAprobacion ? "Solicitar " + sustantivo : verbo;
        const cambiaEstado = puede("estado") || conAprobacion;
        if (puede("gestionar") && !estado.editandoEmpresa) acciones.push(boton("editar-empresa", "Editar datos", "secondary"));
        if (cambiaEstado && actual === "Activa") acciones.push(boton("suspender", texto("Suspender", "suspensión"), "secondary"));
        if (cambiaEstado && actual === "Suspendida") acciones.push(boton("activar", texto("Activar", "activación"), "primary"));
        if (cambiaEstado && actual !== "Inactiva") acciones.push(boton("inactivar", texto("Inactivar", "inactivación"), "danger"));
        if ((puede("reactivar") || conAprobacion) && actual === "Inactiva") acciones.push(boton("reactivar", texto("Reactivar", "reactivación"), "primary"));

        let nota = "";
        if (actual === "Inactiva" && !puede("reactivar") && !conAprobacion) {
          nota = '<p class="comite-readonly-note">La empresa está inactiva. Solo el Super Administrador puede reactivarla.</p>';
        }
        if (conAprobacion) {
          nota += '<p class="comite-readonly-note">Los cambios de estado y las eliminaciones que usted pida quedan pendientes hasta que un administrador los apruebe.</p>';
        }

        const formulario = estado.editandoEmpresa
          ? '<div class="comite-detail-section"><h4>Editar datos</h4><div class="portal-form-grid">' +
          campo("empNombre", "Nombre o razón social", e.nombre, "full") + campo("empNit", "NIT", e.nit) +
          campo("empCorreo", "Correo", e.correo, "", "email") + campo("empCiudad", "Ciudad", e.ciudad) + campo("empDireccion", "Dirección", e.direccion) +
          '</div><div class="comite-decision-actions">' + boton("guardar-empresa", "Guardar cambios", "primary") + boton("cancelar-empresa", "Cancelar", "secondary") + "</div></div>"
          : "";

        return panel(
          '<div class="comite-detail-heading"><div><span class="comite-kicker">Empresa</span><h3>' + esc(e.nombre) + "</h3></div>" + chip(actual) + "</div>" +
          '<dl class="comite-facts">' + fact("NIT", e.nit || "-") + fact("Correo", e.correo || "-") + fact("Ciudad", e.ciudad || "-") + fact("Dirección", e.direccion || "-") + "</dl>" +
          nota +
          (acciones.length ? '<div class="comite-decision-actions">' + acciones.join("") + "</div>" : "") +
          formulario
        );
      }

      // EMP-021 a EMP-026 y EMP-030
      function panelSedes(sedes) {
        const gestionar = puede("gestionar");
        const editada = sedes.find((s) => String(s.id_sede) === estado.sedeEditada);

        const filas = sedes.map((s) => "<tr><td><strong>" + esc(s.nombre_sede) + "</strong></td><td>" + esc(s.direccion) + "</td>" +
          "<td>" + esc(s.ciudad) + "</td><td>" + esc(s.departamento || "-") + "</td><td>" + (s.es_principal ? "Sí" : "No") + "</td><td>" + chip(s.estado) + "</td>" +
          '<td><div class="comite-decision-actions" style="margin-top:0">' + accion("contactos", "Contactos", s.id_sede) +
          (gestionar ? accion("editar-sede", "Editar", s.id_sede) : "") +
          (puede("eliminar") ? accion("eliminar-sede", "Eliminar", s.id_sede) : "") +
          (puede("solicitar") ? accion("eliminar-sede", "Solicitar eliminación", s.id_sede) : "") +
          "</div></td></tr>").join("");

        let formulario = "";
        if (gestionar && editada) {
          formulario = '<div class="comite-detail-section"><h4>Editar sede: ' + esc(editada.nombre_sede) + "</h4>" +
            '<dl class="comite-facts">' + fact("Ciudad", editada.ciudad) + fact("Departamento", editada.departamento || "-") + fact("País", editada.pais || "-") + "</dl>" +
            '<p class="comite-readonly-note">Ciudad, departamento y país no se pueden cambiar. Si están mal, inactive la sede y registre otra.</p>' +
            '<div class="portal-form-grid" style="margin-top:14px">' +
            campo("sedeNombre", "Nombre de la sede", editada.nombre_sede) +
            selector("sedePrincipal", "Sede principal", [["false", "No"], ["true", "Sí"]], String(Boolean(editada.es_principal))) +
            campo("sedeDireccion", "Dirección", editada.direccion) +
            selector("sedeEstado", "Estado", [["Activa", "Activa"], ["Inactiva", "Inactiva"]], editada.estado || "Activa") +
            '</div><div class="comite-decision-actions">' + boton("guardar-sede", "Guardar cambios", "primary") + boton("cancelar-sede", "Cancelar", "secondary") + "</div></div>";
        } else if (gestionar) {
          formulario = '<div class="comite-detail-section"><h4>Registrar sede</h4><div class="portal-form-grid">' +
            campo("sedeNombre", "Nombre de la sede", "") +
            selector("sedePrincipal", "Sede principal", [["false", "No"], ["true", "Sí"]], "false") +
            campo("sedeDireccion", "Dirección", "", "full") +
            campo("sedeCiudad", "Ciudad", "") + campo("sedeDepartamento", "Departamento", "") + campo("sedePais", "País", "Colombia") +
            '<p class="full comite-readonly-note" style="margin-top:0">Ciudad, departamento y país solo se indican ahora: después no se pueden cambiar.</p>' +
            '</div><div class="comite-decision-actions">' + boton("guardar-sede", "Registrar sede", "primary") + "</div></div>";
        }

        return panel(
          encabezado("Sedes", sedes.length + (sedes.length === 1 ? " sede registrada" : " sedes registradas")) +
          '<div class="comite-table-wrap"><table><thead><tr><th>Sede</th><th>Dirección</th><th>Ciudad</th><th>Departamento</th><th>Principal</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>' +
          (filas || vacioTabla(7, "La empresa todavía no tiene sedes.")) +
          "</tbody></table></div>" + formulario
        );
      }

      // EMP-027 / EMP-028 / EMP-029
      function panelContactos(sede, contactos) {
        const cerrar = boton("cerrar-contactos", "Cerrar", "secondary");
        if (contactos && contactos.error) {
          return panel(encabezado("Contactos de " + esc(sede.nombre_sede), "", cerrar) + '<p class="comite-muted">' + esc(contactos.error) + "</p>");
        }
        const lista = contactos || [];
        const editado = lista.find((c) => String(c.id_contacto) === estado.contactoEditado);

        const filas = lista.map((c) => "<tr><td><strong>" + esc(c.nombre) + "</strong></td><td>" + esc(c.cargo || "-") + "</td>" +
          "<td>" + esc(c.telefono || "-") + "</td><td>" + esc(c.correo || "-") + "</td>" +
          '<td><div class="comite-decision-actions" style="margin-top:0">' +
          (puede("gestionar") ? accion("editar-contacto", "Editar", c.id_contacto) : "") +
          (puede("eliminar") ? accion("eliminar-contacto", "Eliminar", c.id_contacto) : "") +
          (puede("solicitar") ? accion("eliminar-contacto", "Solicitar eliminación", c.id_contacto) : "") +
          "</div></td></tr>").join("");

        const formulario = puede("gestionar")
          ? '<div class="comite-detail-section"><h4>' + (editado ? "Editar contacto" : "Registrar contacto") + '</h4><div class="portal-form-grid">' +
          campo("contNombre", "Nombre", editado ? editado.nombre : "") + campo("contCargo", "Cargo", editado ? editado.cargo : "") +
          campo("contTelefono", "Teléfono", editado ? editado.telefono : "", "", "tel") + campo("contCorreo", "Correo", editado ? editado.correo : "", "", "email") +
          '</div><div class="comite-decision-actions">' + boton("guardar-contacto", editado ? "Guardar cambios" : "Registrar contacto", "primary") +
          (editado ? boton("cancelar-contacto", "Cancelar", "secondary") : "") + "</div></div>"
          : "";

        return panel(
          encabezado("Contactos de " + esc(sede.nombre_sede), "Personas de contacto de la sede.", cerrar) +
          '<div class="comite-table-wrap"><table><thead><tr><th>Nombre</th><th>Cargo</th><th>Teléfono</th><th>Correo</th><th>Acciones</th></tr></thead><tbody>' +
          (filas || vacioTabla(5, "La sede no tiene contactos registrados.")) +
          "</tbody></table></div>" + formulario
        );
      }

      // EMP-015 consultar documentos
      function panelDocumentos(documentos) {
        const cuerpo = documentos && documentos.error
          ? '<p class="comite-muted">' + esc(documentos.error) + "</p>"
          : '<div class="comite-table-wrap"><table><thead><tr><th>Tipo</th><th>Número</th><th>Estado</th><th>Vence</th><th>Observaciones</th></tr></thead><tbody>' +
          ((documentos || []).map((d) => "<tr><td><strong>" + esc(d.tipo_documento) + "</strong></td><td>" + esc(d.numero_documento || "-") + "</td>" +
            "<td>" + chip(d.estado_validacion) + "</td><td>" + fecha(d.fecha_vencimiento) + "</td><td>" + esc(d.observaciones || "-") + "</td></tr>").join("") ||
            vacioTabla(5, "La empresa no tiene documentos cargados.")) +
          "</tbody></table></div>";

        return panel(
          encabezado("Documentos de soporte", "Documentos cargados por la empresa.") + cuerpo +
          '<p class="comite-readonly-note" style="margin-top:12px">La carga y revisión de documentos todavía no está disponible en esta pantalla.</p>'
        );
      }

      // EMP-009 historial de la empresa
      function panelHistorial(historial) {
        const cuerpo = historial && historial.error
          ? '<p class="comite-muted">' + esc(historial.error) + "</p>"
          : '<div class="comite-table-wrap"><table><thead><tr><th>Radicado</th><th>Estado</th><th>Creada</th><th>Radicada</th></tr></thead><tbody>' +
          ((historial || []).map((s) => "<tr><td><strong>" + esc(s.numero_radicado || "Borrador") + "</strong></td><td>" + chip(s.estado) + "</td>" +
            "<td>" + fecha(s.fecha_creacion || s.fecha) + "</td><td>" + fecha(s.fecha_radicacion) + "</td></tr>").join("") ||
            vacioTabla(4, "La empresa no tiene solicitudes de certificación.")) +
          "</tbody></table></div>";

        return panel(encabezado("Historial de solicitudes", "Solicitudes de certificación de la empresa.") + cuerpo);
      }

      // ---------------- aprobaciones (permisos REQ) ----------------
      async function cargarAprobaciones() {
        const caja = $("#vista-aprobaciones");
        caja.innerHTML = cargando("Cargando solicitudes de aprobación...");
        try {
          const filtro = estado.filtroAprobacion;
          estado.aprobaciones = (await api("/api/aprobaciones/" + (filtro ? "?estado=" + encodeURIComponent(filtro) : ""))) || [];
          renderizarAprobaciones();
        } catch (error) {
          caja.innerHTML = "";
          mostrar(error.message, "error");
        }
      }

      function puedeAprobar(aprobacion) {
        if (aprobacion.estado !== "Pendiente") return false;
        return aprobacion.codigo_permiso === "EMP-008" ? rol === "superadmin" : puede("aprobar");
      }

      function renderizarAprobaciones() {
        const lista = estado.aprobaciones;
        const enRechazo = lista.find((a) => String(a.id_aprobacion) === estado.rechazando);

        const filas = lista.map((a) => {
          let acciones = "";
          if (puedeAprobar(a)) {
            acciones = accion("aprobar", "Aprobar", a.id_aprobacion) + accion("rechazar", "Rechazar", a.id_aprobacion);
          } else if (a.estado === "Pendiente" && puede("aprobar")) {
            acciones = '<span class="comite-muted">Solo el Super Administrador</span>';
          }
          return "<tr><td>" + fecha(a.fecha_solicitud) + "</td>" +
            "<td><strong>" + esc(a.detalle || a.descripcion) + '</strong><br><span class="comite-muted">' + esc(a.codigo_permiso + " · " + a.descripcion) + "</span></td>" +
            "<td>" + esc(a.empresa_nombre || "-") + "</td>" +
            "<td>" + esc(a.solicitante_nombre || "-") + "</td>" +
            "<td>" + chip(a.estado) + (a.observacion_revision ? '<br><span class="comite-muted">' + esc(a.observacion_revision) + "</span>" : "") + "</td>" +
            '<td><div class="comite-decision-actions" style="margin-top:0">' + acciones + "</div></td></tr>";
        }).join("");

        const rechazo = enRechazo
          ? panel(
            encabezado("Rechazar solicitud", esc(enRechazo.detalle || enRechazo.descripcion)) +
            '<label for="observacionRechazo">Motivo del rechazo</label><textarea id="observacionRechazo" rows="3" maxlength="500"></textarea>' +
            '<div class="comite-decision-actions">' + boton("confirmar-rechazo", "Rechazar solicitud", "danger") + boton("cancelar-rechazo", "Cancelar", "secondary") + "</div>"
          )
          : "";

        $("#vista-aprobaciones").innerHTML = '<div class="portal-stack">' +
          '<div class="comite-toolbar" style="margin-bottom:0"><div class="comite-search-form" style="flex:0 1 260px">' +
          selector("filtroAprobacion", "Estado", [["Pendiente", "Pendientes"], ["Aprobada", "Aprobadas"], ["Rechazada", "Rechazadas"], ["", "Todas"]], estado.filtroAprobacion) +
          "</div></div>" +
          panel(
            encabezado(puede("aprobar") ? "Solicitudes por revisar" : "Solicitudes enviadas", lista.length + (lista.length === 1 ? " solicitud" : " solicitudes")) +
            '<div class="comite-table-wrap"><table><thead><tr><th>Fecha</th><th>Acción</th><th>Empresa</th><th>Solicitante</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>' +
            (filas || vacioTabla(6, "No hay solicitudes de aprobación con este filtro.")) +
            "</tbody></table></div>"
          ) +
          rechazo + "</div>";

        $("#filtroAprobacion").addEventListener("change", (evento) => {
          estado.filtroAprobacion = evento.target.value;
          estado.rechazando = null;
          cargarAprobaciones();
        });
      }

      // ---------------- acciones ----------------
      async function terminar(mensaje) {
        await cargarDetalle();
        mostrar(mensaje, "success");
      }

      // Si la acción quedó pendiente de aprobación (202) se muestra ese aviso.
      async function resolver(promesa, mensajeHecho) {
        const respuesta = await promesa;
        await cargarDetalle();
        mostrar(respuesta && respuesta.aprobacion ? respuesta.mensaje : mensajeHecho, "success");
      }

      async function guardarSede(base) {
        if (estado.sedeEditada) {
          await enviar(base + "/sedes/" + estado.sedeEditada, "PUT", {
            nombre_sede: val("sedeNombre"),
            direccion: val("sedeDireccion"),
            es_principal: val("sedePrincipal") === "true",
            estado: val("sedeEstado")
          });
          estado.sedeEditada = null;
          return terminar("Sede actualizada.");
        }

        const cuerpo = {
          nombre_sede: val("sedeNombre"),
          direccion: val("sedeDireccion"),
          ciudad: val("sedeCiudad"),
          departamento: val("sedeDepartamento") || null,
          pais: val("sedePais") || null,
          es_principal: val("sedePrincipal") === "true",
          estado: "Activa"
        };
        if (!cuerpo.nombre_sede || !cuerpo.direccion || !cuerpo.ciudad) throw new Error("Nombre, dirección y ciudad son obligatorios.");
        const aviso = "Ciudad: " + cuerpo.ciudad + "\nDepartamento: " + (cuerpo.departamento || "-") + "\nPaís: " + (cuerpo.pais || "Colombia") +
          "\n\nEstos datos no se podrán cambiar después. ¿Son correctos?";
        if (!confirm(aviso)) return;
        await enviar(base + "/sedes", "POST", cuerpo);
        return terminar("Sede registrada.");
      }

      async function guardarContacto(base) {
        const cuerpo = {
          nombre: val("contNombre"),
          cargo: val("contCargo") || null,
          telefono: val("contTelefono") || null,
          correo: val("contCorreo") || null
        };
        const ruta = base + "/sedes/" + estado.sedeContactos + "/contactos";
        if (estado.contactoEditado) {
          await enviar(ruta + "/" + estado.contactoEditado, "PUT", cuerpo);
        } else {
          await enviar(ruta, "POST", cuerpo);
        }
        estado.contactoEditado = null;
        return terminar("Contacto guardado.");
      }

      async function ejecutar(nombre, id) {
        const base = "/api/empresas/" + estado.actual;
        switch (nombre) {
          case "ver":
            estado.actual = String(id);
            limpiarEdicion();
            return mostrarVista("detalle");
          case "editar-empresa": estado.editandoEmpresa = true; return cargarDetalle();
          case "cancelar-empresa": estado.editandoEmpresa = false; return cargarDetalle();
          case "guardar-empresa":
            await enviar(base, "PUT", { nombre: val("empNombre"), nit: val("empNit"), correo: val("empCorreo"), ciudad: val("empCiudad"), direccion: val("empDireccion") });
            estado.editandoEmpresa = false;
            return terminar("Datos de la empresa guardados.");
          case "suspender":
            return resolver(enviar(base + "/estado", "PATCH", { estado: "Suspendida" }), "Empresa suspendida.");
          case "activar":
            return resolver(enviar(base + "/estado", "PATCH", { estado: "Activa" }), "Empresa activada.");
          case "inactivar":
            if (!confirm(puede("solicitar")
              ? "¿Solicitar la inactivación de la empresa? Un administrador deberá aprobarla."
              : "¿Inactivar la empresa? Solo el Super Administrador podrá reactivarla.")) return;
            return resolver(enviar(base + "/inactivar", "POST"), "Empresa inactivada.");
          case "reactivar":
            return resolver(enviar(base + "/reactivar", "POST"), "Empresa reactivada.");
          case "contactos": estado.sedeContactos = id; estado.contactoEditado = null; return cargarDetalle();
          case "cerrar-contactos": estado.sedeContactos = null; estado.contactoEditado = null; return cargarDetalle();
          case "editar-sede": estado.sedeEditada = id; return cargarDetalle();
          case "cancelar-sede": estado.sedeEditada = null; return cargarDetalle();
          case "guardar-sede": return guardarSede(base);
          case "eliminar-sede": {
            if (!confirm("¿Eliminar la sede? Si ya forma parte de solicitudes de certificación, inactívela en su lugar.")) return;
            const respuesta = await enviar(base + "/sedes/" + id, "DELETE");
            if (!(respuesta && respuesta.aprobacion) && estado.sedeContactos === id) estado.sedeContactos = null;
            return resolver(respuesta, "Sede eliminada.");
          }
          case "editar-contacto": estado.contactoEditado = id; return cargarDetalle();
          case "cancelar-contacto": estado.contactoEditado = null; return cargarDetalle();
          case "guardar-contacto": return guardarContacto(base);
          case "eliminar-contacto":
            if (!confirm("¿Eliminar este contacto?")) return;
            return resolver(enviar(base + "/sedes/" + estado.sedeContactos + "/contactos/" + id, "DELETE"), "Contacto eliminado.");
          case "aprobar":
            if (!confirm("¿Aprobar la solicitud? La acción se ejecutará de inmediato.")) return;
            await enviar("/api/aprobaciones/" + id + "/aprobar", "POST");
            estado.rechazando = null;
            await cargarAprobaciones();
            return mostrar("Solicitud aprobada: la acción se ejecutó.", "success");
          case "rechazar": estado.rechazando = id; return renderizarAprobaciones();
          case "cancelar-rechazo": estado.rechazando = null; return renderizarAprobaciones();
          case "confirmar-rechazo":
            await enviar("/api/aprobaciones/" + estado.rechazando + "/rechazar", "POST", { observacion: val("observacionRechazo") });
            estado.rechazando = null;
            await cargarAprobaciones();
            return mostrar("Solicitud rechazada.", "success");
        }
      }

      // ---------------- eventos ----------------
      $("#menu").addEventListener("click", (evento) => {
        const boton = evento.target.closest("[data-view]");
        if (boton) mostrarVista(boton.dataset.view);
      });

      const contenido = document.querySelector(".comite-content");
      contenido.addEventListener("click", async (evento) => {
        const ir = evento.target.closest("[data-ir]");
        if (ir) return mostrarVista(ir.dataset.ir);
        const objetivo = evento.target.closest("button[data-accion]");
        if (!objetivo) return;
        try {
          await ejecutar(objetivo.dataset.accion, objetivo.dataset.id);
        } catch (error) {
          mostrar(error.message, "error");
        }
      });
      contenido.addEventListener("change", (evento) => {
        if (evento.target.id !== "selectorEmpresa") return;
        estado.actual = evento.target.value;
        limpiarEdicion();
        cargarDetalle();
      });

      $("#formRegistrar").addEventListener("submit", async (evento) => {
        evento.preventDefault();
        try {
          const creada = await enviar("/api/empresas/", "POST", {
            nombre: val("regNombre"), nit: val("regNit"), correo: val("regCorreo"), ciudad: val("regCiudad"), direccion: val("regDireccion")
          });
          evento.target.reset();
          if (esEmpresa) estado.mias = (await api("/api/empresas/mias")) || [];
          estado.actual = String(creada.id_empresa);
          limpiarEdicion();
          mostrarVista("detalle");
          mostrar("Empresa registrada. Ahora agregue sus sedes.", "success");
        } catch (error) {
          mostrar(error.message, "error");
        }
      });

      $("#refreshButton").addEventListener("click", () => {
        if (estado.vista === "listado") cargarListado();
        if (estado.vista === "detalle") cargarDetalle();
        if (estado.vista === "aprobaciones") cargarAprobaciones();
      });

      $("#logoutButton").addEventListener("click", () => {
        localStorage.clear();
        window.location.href = "/login";
      });

      // ---------------- arranque ----------------
      (async () => {
        if (esEmpresa) {
          try {
            estado.mias = (await api("/api/empresas/mias")) || [];
          } catch (_) {
            estado.mias = [];
          }
          estado.actual = estado.mias.length ? String(estado.mias[0].id_empresa) : null;
          return mostrarVista("detalle");
        }
        mostrarVista(puede("listar") ? "listado" : "detalle");
      })();
    })();
  </script>
  <script src="/static/session.js"></script>
</body>

</html>
