<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertiSENA - Registrarse</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<header class="login-header">
  <div class="header-content">

        <div class="header-left">

    <img src="/static/sena_blanco.png"
         alt="Logo SENA"
         class="sena-blanco">

    <div>

        <h1>CertiSENA</h1>

        <p class="subtitle">
            Plataforma de gestión y consulta de certificados
        </p>

        <p style="font-size:12px;opacity:.85;margin-top:4px;">
            Servicio Nacional de Aprendizaje • CertiSENA
        </p>

    </div>

</div>

        <div class="header-buttons">

            <a href="/login" class="btn-login">
                Iniciar sesión
            </a>

        </div>

        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menú">
            <span></span>
            <span></span>
            <span></span>
        </button>

    </div>

    <div class="mobile-menu" id="mobileMenu">
        <a href="/login">Iniciar sesión</a>
    </div>

</header>

<main class="login-container">

    <section class="login-form">

        <h2>Crear cuenta</h2>

        <div class="form-group">

            <label for="nombre">
                Nombre completo
            </label>

            <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Ingrese su nombre completo"
                required
                minlength="4">

        </div>

        <div class="form-group">

            <label for="correo">
                Correo electrónico
            </label>

            <input
                type="email"
                id="correo"
                name="correo"
                placeholder="Ingrese su correo electrónico"
                required>

        </div>

        <div class="form-group">

            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Ingrese una contraseña (mínimo 6 caracteres)"
                required
                minlength="6">

        </div>

        <div class="form-group">

            <label for="rol">
                Rol
            </label>

            <select id="rol" name="rol" required>
                <option value="">Seleccione un rol</option>
                <option value="1">Administrador</option>
                <option value="2">Instructor</option>
                <option value="3">Aprendiz</option>
            </select>

        </div>

        <button type="submit" id="btnRegister" class="btn-login">
            Registrarse
        </button>

        <div id="errorMessage" class="error-message"></div>

    </section>

</main>

<footer class="login-footer">

    <p>
        © 2026 CertiSENA - SENA. Todos los derechos reservados.
    </p>

</footer>

<script>

document.getElementById("btnRegister").addEventListener("click", async function(e){

    e.preventDefault();

    const nombre = document.getElementById("nombre").value.trim();

    const correo = document.getElementById("correo").value.trim();

    const password = document.getElementById("password").value;

    const rol = document.getElementById("rol").value;

    const errorMsg = document.getElementById("errorMessage");

    errorMsg.textContent = "";

    if(!nombre || !correo || !password || !rol){

        errorMsg.textContent = "Por favor complete todos los campos.";

        return;

    }

    errorMsg.textContent = "Registrando...";

    try{

        const response = await fetch("/users/create-user",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                nombre,
                correo,
                contrasena: password,
                rol: parseInt(rol)
            })

        });

        const data = await response.json();

        if(!response.ok){

            errorMsg.textContent = data.detail || "Error al registrarse. Inténtalo de nuevo.";

            return;

        }

        window.location.href = "/login";

    }

    catch(error){

        errorMsg.textContent = "Error de conexión con el servidor.";

    }

});

// Menú hamburguesa
const hamburgerBtn = document.getElementById("hamburgerBtn");
const mobileMenu = document.getElementById("mobileMenu");

hamburgerBtn.addEventListener("click", function(){
    this.classList.toggle("active");
    mobileMenu.classList.toggle("open");
});

document.querySelectorAll(".mobile-menu a").forEach(link => {
    link.addEventListener("click", function(){
        hamburgerBtn.classList.remove("active");
        mobileMenu.classList.remove("open");
    });
});

</script>

</body>
</html>
