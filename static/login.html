<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertiSENA - Iniciar sesión</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<header class="login-header">
  <div class="header-content">

        <div class="header-left">

    <img src="/static/sena_blanco.png"
         alt="Logo SENA"
         class="sena-blanco">

    <div>

        <h1>CertiSENA</h1>

        <p class="subtitle">
            Plataforma de gestión y consulta de certificados
        </p>

        <p style="font-size:12px;opacity:.85;margin-top:4px;">
            Servicio Nacional de Aprendizaje • CertiSENA
        </p>

    </div>

</div>

        <div class="header-buttons">

            <a href="/register" class="btn-login">
                Registrarse
            </a>

        </div>

        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menú">
            <span></span>
            <span></span>
            <span></span>
        </button>

    </div>

    <div class="mobile-menu" id="mobileMenu">
        <a href="/register">Registrarse</a>
    </div>

</header>

<main class="login-container">

    <section class="login-form">

        <h2>Iniciar sesión</h2>

        <div class="form-group">

            <label for="correo">
                Correo o usuario
            </label>

            <input
                type="text"
                id="correo"
                name="correo"
                placeholder="Ingrese su correo o nombre de usuario"
                required
                minlength="3">

        </div>

        <div class="form-group">

            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Ingrese su contraseña"
                required
                minlength="1">

        </div>

        <button type="submit" id="btnLogin" class="btn-login">
            Entrar
        </button>

        <div id="errorMessage" class="error-message"></div>

    </section>

</main>

<footer class="login-footer">

    <p>
        © 2026 CertiSENA - SENA. Todos los derechos reservados.
    </p>

</footer>

<script>

document.getElementById("btnLogin").addEventListener("click", async function(e){

    e.preventDefault();

    const correo = document.getElementById("correo").value.trim();

    const password = document.getElementById("password").value;

    const errorMsg = document.getElementById("errorMessage");

    errorMsg.textContent = "";

    if(!correo || !password){

        errorMsg.textContent = "Por favor complete todos los campos.";

        return;

    }

    errorMsg.textContent = "Intentando iniciar sesión...";

    try{

        const response = await fetch("/auth/login",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                correo,
                password
            })

        });

        const data = await response.json();

        if(!response.ok){

            errorMsg.textContent = data.detail || "Credenciales inválidas. Inténtalo de nuevo.";

            return;

        }

        localStorage.setItem("access_token", data.access_token);

        localStorage.setItem("token_type", data.token_type);

        window.location.href = "/dashboard";

    }

    catch(error){

        errorMsg.textContent = "Error de conexión con el servidor.";

    }

});

// Menú hamburguesa
const hamburgerBtn = document.getElementById("hamburgerBtn");
const mobileMenu = document.getElementById("mobileMenu");

hamburgerBtn.addEventListener("click", function(){
    this.classList.toggle("active");
    mobileMenu.classList.toggle("open");
});

document.querySelectorAll(".mobile-menu a").forEach(link => {
    link.addEventListener("click", function(){
        hamburgerBtn.classList.remove("active");
        mobileMenu.classList.remove("open");
    });
});

</script>

</body>
</html>
