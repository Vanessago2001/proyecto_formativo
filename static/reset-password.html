<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertiSENA - Restablecer contraseña</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<header class="login-header">
  <div class="header-content">

    <div class="header-left">

        <img src="/static/sena_blanco.png"
             alt="Logo SENA"
             class="sena-blanco">

        <div>
            <h1>CertiSENA</h1>
            <p class="subtitle">
                Plataforma de gestión y consulta de certificados
            </p>
        </div>

    </div>

  </div>
</header>

<main class="login-container">

    <section class="login-form">

        <h2>Restablecer contraseña</h2>

        <!-- ===== Formulario de nueva contraseña ===== -->
        <div id="resetForm">

            <p class="code-info">
                Cree una nueva contraseña para su cuenta.<br>
                Debe tener mínimo 8 caracteres, con mayúscula, minúscula,
                número y un carácter especial.
            </p>

            <div class="form-group">
                <label for="nuevaPassword">Nueva contraseña</label>
                <input
                    type="password"
                    id="nuevaPassword"
                    name="nuevaPassword"
                    placeholder="Ingrese su nueva contraseña"
                    required
                    minlength="8">
            </div>

            <div class="form-group">
                <label for="confirmarPassword">Confirmar contraseña</label>
                <input
                    type="password"
                    id="confirmarPassword"
                    name="confirmarPassword"
                    placeholder="Repita su nueva contraseña"
                    required
                    minlength="8">
            </div>

            <button type="button" id="btnReset" class="btn-login">
                Guardar contraseña
            </button>

        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <p style="margin-top:16px;">
            <a href="/login">Volver a iniciar sesión</a>
        </p>

    </section>

</main>

<footer class="login-footer">
    <p>© 2026 CertiSENA - SENA. Todos los derechos reservados.</p>
</footer>

<script>

// ===== Referencias =====
const resetForm    = document.getElementById("resetForm");
const btnReset     = document.getElementById("btnReset");
const errorMsg     = document.getElementById("errorMessage");
const successMsg   = document.getElementById("successMessage");
const inputNueva   = document.getElementById("nuevaPassword");
const inputConfirm = document.getElementById("confirmarPassword");

// ===== Leer el token del enlace (?token=...) =====
const params = new URLSearchParams(window.location.search);
const token  = params.get("token");

if(!token){
    resetForm.classList.add("hidden-section");
    errorMsg.textContent =
        "El enlace no es válido o está incompleto. Solicite uno nuevo desde el inicio de sesión.";
}

// ===== Guardar la nueva contraseña =====
btnReset.addEventListener("click", async function(){

    errorMsg.textContent = "";
    successMsg.textContent = "";

    const nueva    = inputNueva.value;
    const confirma = inputConfirm.value;

    if(!nueva || !confirma){
        errorMsg.textContent = "Por favor complete ambos campos.";
        return;
    }

    if(nueva !== confirma){
        errorMsg.textContent = "Las contraseñas no coinciden.";
        return;
    }

    errorMsg.textContent = "Guardando la nueva contraseña...";

    try{

        const response = await fetch("/auth/reset-password",{
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify({
                token: token,
                nueva_password: nueva
            })
        });

        const data = await response.json();

        if(!response.ok){
            errorMsg.textContent =
                (typeof data.detail === "string" ? data.detail : "No se pudo restablecer la contraseña.");
            return;
        }

        // Éxito → ocultar el formulario y redirigir al login
        resetForm.classList.add("hidden-section");
        errorMsg.textContent = "";
        successMsg.textContent =
            (data.mensaje || "Contraseña restablecida correctamente.") +
            " Redirigiendo al inicio de sesión...";

        setTimeout(function(){
            window.location.href = "/login";
        }, 2500);

    }
    catch(error){
        errorMsg.textContent = "Error de conexión con el servidor.";
    }

});

</script>

</body>
</html>
