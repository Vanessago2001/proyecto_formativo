<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertiSENA - Consulta de documentos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<header class="login-header">
  <div class="header-content">

        <div class="header-left">

    <img src="/static/sena_blanco.png"
         alt="Logo SENA"
         class="sena-blanco">

    <div>

        <h1>CertiSENA</h1>

        <p class="subtitle">
            Plataforma de gestión y consulta de certificados
        </p>

        <p style="font-size:12px;opacity:.85;margin-top:4px;">
            Servicio Nacional de Aprendizaje • CertiSENA
        </p>

    </div>

</div>

        <div class="header-buttons">

            <a href="/login" class="btn-login">
                Iniciar sesión
            </a>

            <a href="/register" class="btn-login">
                Registrarse
            </a>

        </div>

        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menú">
            <span></span>
            <span></span>
            <span></span>
        </button>

    </div>

    <div class="mobile-menu" id="mobileMenu">
        <a href="/login">Iniciar sesión</a>
        <a href="/register">Registrarse</a>
    </div>

</header>

<main class="login-container">

    <section class="login-form">

        <h2>Consulta de documentos</h2>

        <div class="form-group">

            <label for="radicado">
                Radicado del documento
            </label>

            <input
                type="text"
                id="radicado"
                name="radicado"
                placeholder="Ingrese el radicado"
                required>

        </div>

        <div class="form-group">

            <label for="nit">
                NIT de la empresa
            </label>

            <input
                type="text"
                id="nit"
                name="nit"
                placeholder="Ingrese el NIT"
                required>

        </div>

        <button
            type="button"
            id="btnConsultar"
            class="btn-login">

            Consultar

        </button>

        <div id="resultadoConsulta"
             class="resultado-container"></div>

    </section>

</main>

<footer class="login-footer">

    <p>
        © 2026 CertiSENA - SENA. Todos los derechos reservados.
    </p>

</footer>

<script>

document.getElementById("btnConsultar").addEventListener("click", async function(){

    const radicado = document.getElementById("radicado").value.trim();

    const nit = document.getElementById("nit").value.trim();

    const resultado = document.getElementById("resultadoConsulta");

    if(!radicado || !nit){

        resultado.innerHTML =
        '<p class="error-message">Por favor complete todos los campos.</p>';

        return;

    }

    resultado.innerHTML =
    "<p class='subtitle'>Consultando...</p>";

    try{

        const response = await fetch("/api/documentos/consultar",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                radicado,
                nit
            })

        });

        const data = await response.json();

        if(!response.ok){

            resultado.innerHTML=
            `<p class="error-message">${data.detail || "Error al consultar."}</p>`;

            return;

        }

        resultado.innerHTML=`

            <div style="text-align:left;">

                <h3 style="color:#3BAA01;">
                    Documento encontrado
                </h3>

                <p><strong>Radicado:</strong> ${data.radicado || radicado}</p>

                <p><strong>NIT:</strong> ${data.nit || nit}</p>

                <p><strong>Estado:</strong> ${data.estado || "N/A"}</p>

                <p><strong>Fecha:</strong> ${data.fecha || "N/A"}</p>

            </div>

        `;

    }

    catch(error){

        resultado.innerHTML=
        '<p class="error-message">Error de conexión con el servidor.</p>';

    }

});

// Menú hamburguesa
const hamburgerBtn = document.getElementById("hamburgerBtn");
const mobileMenu = document.getElementById("mobileMenu");

hamburgerBtn.addEventListener("click", function(){
    this.classList.toggle("active");
    mobileMenu.classList.toggle("open");
});

document.querySelectorAll(".mobile-menu a").forEach(link => {
    link.addEventListener("click", function(){
        hamburgerBtn.classList.remove("active");
        mobileMenu.classList.remove("open");
    });
});

</script>

</body>
</html>
