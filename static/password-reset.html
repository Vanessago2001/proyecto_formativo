<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>

<header class="login-header">
    <div class="header-content">
        <div class="header-left">

            <img src="/static/sena_blanco.png" class="sena-blanco">

            <div>
                <h1>CertiSENA</h1>

                <p class="subtitle">
                    Plataforma de gestión y consulta de certificados
                </p>
            </div>

        </div>
    </div>
</header>

<main class="login-container">

<section class="login-form">

<h2>Recuperar contraseña</h2>

<p>
Ingresa tu correo electrónico para recibir un código de verificación.
</p>

<div class="form-group">

<label>Correo electrónico</label>

<input
type="email"
id="correo"
placeholder="Ingrese su correo">

</div>

<button
id="btnEnviar"
class="btn-login">

Enviar código

</button>

<div id="message" class="error-message"></div>

<div class="forgot-password">
<a href="/login">
Volver al inicio de sesión
</a>
</div>

</section>

</main>

<footer class="login-footer">
<p>© 2026 CertiSENA - SENA</p>
</footer>

<script>

const btn=document.getElementById("btnEnviar");

const message=document.getElementById("message");

btn.addEventListener("click",async()=>{

const correo=document.getElementById("correo").value.trim();

message.textContent="";

if(!correo){

message.textContent="Ingrese un correo.";

return;

}

btn.disabled=true;

message.textContent="Enviando código...";

try{

const response=await fetch("/password-reset/request",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
correo
})

});

const data=await response.json();

if(!response.ok){

message.textContent=data.detail||"No fue posible enviar el código.";

btn.disabled=false;

return;

}

sessionStorage.setItem(
"password_reset_correo",
correo
);

window.location.href="/password-reset/verify";

}catch(error){

console.error(error);

message.textContent="Error de conexión.";

btn.disabled=false;

}

});

</script>

</body>
</html>
